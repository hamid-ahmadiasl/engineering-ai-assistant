name: Sync Hugging Face Space

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check Space secrets
        id: check
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HF_SPACE: ${{ secrets.HF_SPACE }}
        run: |
          if [ -z "$HF_TOKEN" ] || [ -z "$HF_SPACE" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "HF_TOKEN or HF_SPACE is not set. Skipping the Space sync."
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Push to the Hugging Face Space
        if: steps.check.outputs.skip == 'false'
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HF_SPACE: ${{ secrets.HF_SPACE }}
        run: |
          set -euo pipefail
          git clone "https://user:${HF_TOKEN}@huggingface.co/spaces/${HF_SPACE}" /tmp/space
          rsync -a --delete \
            --exclude .git \
            --exclude .venv \
            --exclude data \
            --exclude .env \
            --exclude .github \
            ./ /tmp/space/
          {
            cat deploy/hf-readme-front-matter.md
            printf '\n---\n\n'
            cat README.md
          } > /tmp/space/README.md
          cd /tmp/space
          git config user.email "actions@users.noreply.github.com"
          git config user.name "github-actions"
          git add -A
          if git diff --cached --quiet; then
            echo "Space already matches this commit."
          else
            git commit -m "Sync from GitHub ${GITHUB_SHA}"
            git push
          fi
